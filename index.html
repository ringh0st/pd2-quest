<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161412" />
    <meta name="description" content="Bite-sized, ADHD-friendly prep for the Salesforce Platform Developer II exam." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PD2 Quest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>PD2 Quest</title>
    <script>
      // Paint the right theme before React loads (no white flash).
      try {
        var s = JSON.parse(localStorage.getItem('pd2quest.v1') || '{}').settings || {};
        var t = s.theme && s.theme !== 'system' ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* Boot splash: shows instantly while the app's JavaScript loads, then the animated splash takes over. */
      #boot-splash { position: fixed; inset: 0; z-index: 999; display: grid; place-content: center; justify-items: center; gap: 14px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; background: #FFF9F2; color: #2B2118; }
      :root[data-theme='dark'] #boot-splash { background: #161412; color: #F6F1EA; }
      #boot-splash .t { font-size: 48px; font-weight: 800; letter-spacing: -0.02em; color: #B3125F; }
      :root[data-theme='dark'] #boot-splash .t { color: #FF7AB6; }
      #boot-splash .t b { color: #8A5A00; font-weight: 800; }
      :root[data-theme='dark'] #boot-splash .t b { color: #FFC94D; }
      #boot-splash .s { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; }
      #boot-splash .bar { width: 200px; height: 8px; border-radius: 99px; overflow: hidden; background: rgba(128,128,128,0.18); }
      #boot-splash .bar i { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #B3125F, #FFC94D); animation: bootSlide 1.2s ease-in-out infinite; }
      #boot-splash .f { position: absolute; bottom: max(22px, env(safe-area-inset-bottom)); left: 0; right: 0; font-size: 14px; opacity: 0.75; }
      @keyframes bootSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .bar i { animation: none; width: 100%; opacity: 0.6; } }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="t">PD2 <b>Quest</b></div>
      <div class="s">Salesforce Platform Developer II</div>
      <div class="bar"><i></i></div>
      <div class="f">A <strong>Ringhost’s Games</strong> production</div>
    </div>
    <div id="root"></div>
    <noscript>PD2 Quest needs JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
